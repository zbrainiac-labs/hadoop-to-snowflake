[desktop]
  secret_key=hadoop-test-stack-secret
  http_host=0.0.0.0
  http_port=8888
  time_zone=UTC
  [[database]]
    engine=postgresql_psycopg2
    host=hue-postgres
    port=5432
    user=hue
    password=hue
    name=hue

[beeswax]
  hive_server_host=hiveserver2
  hive_server_port=10000
  hive_metastore_host=metastore
  hive_metastore_port=9083

[hadoop]
  [[hdfs_clusters]]
    [[[default]]]
      fs_defaultfs=hdfs://namenode:9000
      webhdfs_url=http://namenode:9870/webhdfs/v1

[notebook]
  [[interpreters]]
    [[[hive]]]
      name=Hive
      interface=hiveserver2
